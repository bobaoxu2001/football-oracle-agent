# Hosted production scheduler. Cadence <= 5 minutes.
# Invokes Vercel /api/ops/tick with CRON_SECRET. Does not invent results.
# Overlap is serialized by separate Mongo leases (90 seconds for the forecast
# tick, 180 seconds for observers).
#
# Three complementary recurrence paths:
#   1. offset 5-minute cron — one-shot backup pinger;
#   2. hourly cron — loop bootstrap/recovery safety net;
#   3. a normally completed loop — exactly one deliberate workflow_dispatch
#      successor, gated by OPS_HANDOFF_ENABLED.
# The loop and one-shot paths have separate concurrency groups. A successor
# waits behind the current loop; the current loop is never canceled. GitHub's
# single pending slot also prevents multiple effective successor chains.
name: ops-tick

run-name: ${{ inputs.parent_run_id != '' && format('ops-tick handoff-from-{0}', inputs.parent_run_id) || format('ops-tick {0}', github.event_name) }}

on:
  schedule:
    # Avoid the top-of-hour congestion window where hosted schedules are most
    # commonly delayed. Both expressions preserve the same operational cadence.
    - cron: "3-58/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run one backup tick or a supervised loop"
        type: choice
        required: true
        default: "loop"
        options:
          - once
          - loop
      continue_chain:
        description: "Allow a successful loop to create one successor"
        type: boolean
        required: true
        default: false
      rounds:
        description: "Manual loop rounds (1-60); successors always use 60"
        type: number
        required: true
        default: 60
      parent_run_id:
        description: "Auditable parent run id for a deliberate handoff"
        type: string
        required: false
        default: ""

# Each job declares only the token permissions it needs.
permissions: {}

# Separate groups per trigger, on purpose. A single shared group let the long
# supervised loop suppress the short one-shot backup. Overlap between the two
# groups is safe: the core tick and observers are independently idempotent and
# serialized by their Mongo leases (409 = already running).
concurrency:
  group: football-oracle-ops-tick-${{ (github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'loop')) && 'loop' || 'once' }}
  cancel-in-progress: false

jobs:
  tick:
    name: production-ops-tick
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GitHub-hosted jobs have a six-hour ceiling. Five hours of rounds plus a
    # 30-minute cleanup/latency margin stays below it.
    timeout-minutes: 330
    steps:
      - name: Authenticated production ticks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_TICK_URL: ${{ vars.OPS_TICK_URL }}
          OPS_OBSERVER_URL: ${{ vars.OPS_OBSERVER_URL }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '17 * * * *' && 'loop' || 'once') }}
          REQUESTED_ROUNDS: ${{ inputs.rounds }}
          MAX_CONSECUTIVE_FAILURES: "3"
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "missing CRON_SECRET"
            exit 1
          fi
          MODE="${MODE:-once}"
          URL="${OPS_TICK_URL:-https://football-oracle-agent.vercel.app/api/ops/tick}"
          if [[ "$URL" == *\?* ]]; then
            CORE_URL="${URL}&core=1"
          else
            CORE_URL="${URL}?core=1"
          fi
          if [ "$MODE" = "once" ]; then
            CORE_URL="${CORE_URL}&backup=1"
          fi
          OBSERVER_URL="${OPS_OBSERVER_URL:-https://football-oracle-agent.vercel.app/api/ops/observers}"
          REQUESTED_ROUNDS="${REQUESTED_ROUNDS:-60}"
          ROUNDS=1
          if [ "$MODE" = "loop" ]; then
            if ! [[ "${REQUESTED_ROUNDS:-}" =~ ^[0-9]+$ ]]; then
              echo "invalid rounds=${REQUESTED_ROUNDS:-missing}"
              exit 1
            fi
            if [ "$REQUESTED_ROUNDS" -lt 1 ] || [ "$REQUESTED_ROUNDS" -gt 60 ]; then
              echo "rounds must be between 1 and 60"
              exit 1
            fi
            ROUNDS="$REQUESTED_ROUNDS"
          fi
          echo "mode=${MODE} rounds=${ROUNDS} max_consecutive_failures=${MAX_CONSECUTIVE_FAILURES}"
          core_consecutive_failures=0
          observer_consecutive_failures=0
          total_failures=0
          fatal=0
          completed_rounds=0
          for i in $(seq 1 "$ROUNDS"); do
            ROUND_STARTED_AT="$(date +%s)"
            AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            : > /tmp/tick-body
            CODE="$(curl -sS -o /tmp/tick-body -w "%{http_code}" \
              --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "User-Agent: football-oracle-ops-scheduler" \
              "$CORE_URL" || true)"
            echo "round=${i} at=${AT} status=${CODE}"
            python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/tick-body").read_text(errors="replace")
          print(text[:800])
          PY
            if [ "$CODE" != "200" ] && [ "$CODE" != "409" ]; then
              core_consecutive_failures="$(( core_consecutive_failures + 1 ))"
              total_failures="$(( total_failures + 1 ))"
              echo "failure_state=http_${CODE} consecutive=${core_consecutive_failures}"
            else
              if [ "$core_consecutive_failures" -gt 0 ]; then
                echo "failure_recovery=core previous_consecutive=${core_consecutive_failures}"
              fi
              core_consecutive_failures=0
              echo "failure_state=none"
            fi
            : > /tmp/observer-body
            OBSERVER_CODE="$(curl -sS -o /tmp/observer-body -w "%{http_code}" \
              --max-time 130 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "User-Agent: football-oracle-ops-scheduler" \
              "$OBSERVER_URL" || true)"
            echo "observers_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${OBSERVER_CODE}"
            python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/observer-body").read_text(errors="replace")
          print(text[:800])
          PY
            if [ "$OBSERVER_CODE" != "200" ] && [ "$OBSERVER_CODE" != "409" ]; then
              observer_consecutive_failures="$(( observer_consecutive_failures + 1 ))"
              total_failures="$(( total_failures + 1 ))"
              echo "observer_state=http_${OBSERVER_CODE} consecutive=${observer_consecutive_failures}"
            else
              if [ "$observer_consecutive_failures" -gt 0 ]; then
                echo "failure_recovery=observer previous_consecutive=${observer_consecutive_failures}"
              fi
              observer_consecutive_failures=0
              echo "observer_state=none"
            fi
            completed_rounds="$i"
            if [ "$core_consecutive_failures" -ge "$MAX_CONSECUTIVE_FAILURES" ]; then
              fatal=1
              echo "fatal_state=core_consecutive_failure_threshold"
              break
            fi
            if [ "$i" -lt "$ROUNDS" ]; then
              ELAPSED="$(( $(date +%s) - ROUND_STARTED_AT ))"
              DELAY="$(( 300 - ELAPSED ))"
              if [ "$DELAY" -gt 0 ]; then
                sleep "$DELAY"
              fi
            fi
          done
          {
            echo "### Production tick summary"
            echo "- mode: ${MODE}"
            echo "- rounds: ${completed_rounds}/${ROUNDS}"
            echo "- request failures: ${total_failures}"
            echo "- terminal core failures: ${core_consecutive_failures}"
            echo "- terminal observer failures: ${observer_consecutive_failures}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fatal" -ne 0 ] || [ "$completed_rounds" -ne "$ROUNDS" ] || \
             [ "$core_consecutive_failures" -ne 0 ]; then
            exit 1
          fi
          if [ "$observer_consecutive_failures" -ne 0 ]; then
            echo "::warning::market/ledger observer remains degraded after ${observer_consecutive_failures} consecutive request failure(s); forecast-core recurrence will continue"
          elif [ "$total_failures" -gt 0 ]; then
            echo "::warning::${total_failures} transient request failure(s) recovered before normal completion"
          fi

  handoff:
    name: deliberate-loop-handoff
    needs: tick
    if: >-
      ${{
        needs.tick.result == 'success' &&
        github.run_attempt == 1 &&
        vars.OPS_HANDOFF_ENABLED == 'true' &&
        (
          github.event.schedule == '17 * * * *' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.mode == 'loop' &&
            inputs.continue_chain
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Create one auditable successor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PARENT_RUN_ID: ${{ github.run_id }}
          NEXT_TITLE: ops-tick handoff-from-${{ github.run_id }}
        run: |
          set -euo pipefail
          WORKFLOW_ID="ops-tick.yml"
          API_VERSION="X-GitHub-Api-Version: 2026-03-10"
          gh api \
            -H "$API_VERSION" \
            "/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?event=workflow_dispatch&per_page=100" \
            > /tmp/handoff-runs.json
          EXISTING_RUN_ID="$(python3 -c 'import json, os; runs=json.load(open("/tmp/handoff-runs.json")).get("workflow_runs", []); print(next((str(run["id"]) for run in runs if run.get("display_title") == os.environ["NEXT_TITLE"]), ""))')"
          if [ -n "$EXISTING_RUN_ID" ]; then
            echo "handoff_state=already_exists successor_run_id=${EXISTING_RUN_ID}"
            exit 0
          fi
          python3 - <<'PY' > /tmp/handoff-payload.json
          import json
          import os
          import sys
          json.dump(
              {
                  "ref": os.environ["DEFAULT_BRANCH"],
                  "inputs": {
                      "mode": "loop",
                      "continue_chain": "true",
                      "rounds": "60",
                      "parent_run_id": os.environ["PARENT_RUN_ID"],
                  },
              },
              sys.stdout,
          )
          PY
          gh api \
            --method POST \
            -H "$API_VERSION" \
            "/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            --input /tmp/handoff-payload.json \
            > /tmp/handoff-response.json
          SUCCESSOR_RUN_ID="$(python3 -c 'import json; print(json.load(open("/tmp/handoff-response.json")).get("workflow_run_id", ""))')"
          SUCCESSOR_URL="$(python3 -c 'import json; print(json.load(open("/tmp/handoff-response.json")).get("html_url", ""))')"
          if ! [[ "$SUCCESSOR_RUN_ID" =~ ^[0-9]+$ ]] || [ -z "$SUCCESSOR_URL" ]; then
            echo "handoff_state=invalid_dispatch_response"
            exit 1
          fi
          echo "handoff_state=created successor_run_id=${SUCCESSOR_RUN_ID} successor_url=${SUCCESSOR_URL}"
          {
            echo "### Loop handoff"
            echo "- parent run: ${PARENT_RUN_ID}"
            echo "- successor run: ${SUCCESSOR_RUN_ID}"
            echo "- successor: ${SUCCESSOR_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
