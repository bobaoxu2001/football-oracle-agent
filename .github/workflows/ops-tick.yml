# Hosted production scheduler. Cadence <= 5 minutes.
# Invokes Vercel /api/ops/tick with CRON_SECRET. Does not invent results.
# Recurrence is GitHub-managed; overlap is serialized by separate Mongo leases
# (90 seconds for the forecast tick, 180 seconds for observers).
#
# Two complementary triggers:
#   1. offset 5-minute cron — one-shot backup pinger
#   2. hourly loop — supervised worker that ticks every 5 minutes for ~5 hours.
#      When an hourly event is delivered, GitHub keeps the latest run pending
#      while one is active. A delayed or missing later delivery therefore does
#      not create a freshness gap as soon as a 55-minute runner exits.
# Both paths invoke the isolated observers. Their own Mongo lease makes an
# overlapping backup a healthy no-op instead of a duplicate provider poll.
name: ops-tick

on:
  schedule:
    # Avoid the top-of-hour congestion window where hosted schedules are most
    # commonly delayed. Both expressions preserve the same operational cadence.
    - cron: "3-58/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once or loop"
        default: "loop"

# The job only calls an external URL — it never reads or writes the repo.
permissions:
  contents: read

# Separate groups per trigger, on purpose. A single shared group let the long
# supervised loop hold the queue, so the 5-minute one-shot pings — the backup for
# exactly the case where the loop dies — were suppressed while it ran, and only
# one stale queued run fired afterwards. Overlap between the two is safe: the
# core tick and observers are independently idempotent and serialized by their
# Mongo leases (409 = already running).
concurrency:
  group: football-oracle-ops-tick-${{ (github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'loop')) && 'loop' || 'once' }}
  cancel-in-progress: false

jobs:
  tick:
    name: production-ops-tick
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a six-hour ceiling. Five hours of rounds plus a
    # 30-minute cleanup/latency margin stays below it while bridging observed
    # hour-scale schedule delivery gaps.
    timeout-minutes: 330
    steps:
      - name: Authenticated production ticks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_TICK_URL: ${{ vars.OPS_TICK_URL }}
          OPS_OBSERVER_URL: ${{ vars.OPS_OBSERVER_URL }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '17 * * * *' && 'loop' || 'once') }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "missing CRON_SECRET"
            exit 1
          fi
          MODE="${MODE:-once}"
          URL="${OPS_TICK_URL:-https://football-oracle-agent.vercel.app/api/ops/tick}"
          if [[ "$URL" == *\?* ]]; then
            CORE_URL="${URL}&core=1"
          else
            CORE_URL="${URL}?core=1"
          fi
          if [ "$MODE" = "once" ]; then
            CORE_URL="${CORE_URL}&backup=1"
          fi
          OBSERVER_URL="${OPS_OBSERVER_URL:-https://football-oracle-agent.vercel.app/api/ops/observers}"
          ROUNDS=1
          if [ "$MODE" = "loop" ]; then
            ROUNDS=60
          fi
          echo "mode=${MODE} rounds=${ROUNDS}"
          fail=0
          for i in $(seq 1 "$ROUNDS"); do
            ROUND_STARTED_AT="$(date +%s)"
            AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            : > /tmp/tick-body
            CODE="$(curl -sS -o /tmp/tick-body -w "%{http_code}" \
              --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "User-Agent: football-oracle-ops-scheduler" \
              "$CORE_URL" || true)"
            echo "round=${i} at=${AT} status=${CODE}"
            python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/tick-body").read_text(errors="replace")
          print(text[:800])
          PY
            if [ "$CODE" != "200" ] && [ "$CODE" != "409" ]; then
              echo "failure_state=http_${CODE}"
              fail=1
            else
              echo "failure_state=none"
            fi
            : > /tmp/observer-body
            OBSERVER_CODE="$(curl -sS -o /tmp/observer-body -w "%{http_code}" \
              --max-time 130 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "User-Agent: football-oracle-ops-scheduler" \
              "$OBSERVER_URL" || true)"
            echo "observers_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${OBSERVER_CODE}"
            python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/observer-body").read_text(errors="replace")
          print(text[:800])
          PY
            if [ "$OBSERVER_CODE" != "200" ] && [ "$OBSERVER_CODE" != "409" ]; then
              echo "observer_state=http_${OBSERVER_CODE}"
              fail=1
            else
              echo "observer_state=none"
            fi
            if [ "$i" -lt "$ROUNDS" ]; then
              ELAPSED="$(( $(date +%s) - ROUND_STARTED_AT ))"
              DELAY="$(( 300 - ELAPSED ))"
              if [ "$DELAY" -gt 0 ]; then
                sleep "$DELAY"
              fi
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
